<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Highway 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070f;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
  #hud{position:fixed;top:14px;left:16px;z-index:10;pointer-events:none;
    text-shadow:0 2px 12px #000;line-height:1.35}
  #score{font-size:30px;font-weight:800;letter-spacing:1px;display:block;
    background:linear-gradient(90deg,#38f9d7,#43e97b);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #spd{font-size:13px;opacity:.75;letter-spacing:2px}
  #overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
    padding:24px;background:radial-gradient(circle at 50% 40%,rgba(20,45,100,.9),rgba(3,5,12,.97));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #overlay.hide{display:none}
  h1{font-size:clamp(26px,7vw,50px);letter-spacing:3px;margin-bottom:10px;
    background:linear-gradient(90deg,#38f9d7,#43e97b,#38f9d7);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #sub{font-size:13.5px;line-height:1.8;opacity:.75;margin-bottom:14px;max-width:420px}
  #final{font-size:15px;margin-bottom:18px;opacity:.95;line-height:1.7}
  button{padding:15px 40px;font-size:16px;font-weight:800;letter-spacing:2px;border:0;
    border-radius:999px;cursor:pointer;color:#04121a;
    background:linear-gradient(135deg,#43e97b,#38f9d7);
    box-shadow:0 12px 34px rgba(67,233,123,.4);transition:transform .1s}
  button:active{transform:scale(.95)}
  #touch{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;
    justify-content:space-between;padding:0 20px 26px;pointer-events:none}
  #touch div{pointer-events:auto;width:86px;height:86px;border-radius:50%;font-size:32px;
    display:grid;place-items:center;user-select:none;color:#bffcf0;
    background:rgba(255,255,255,.07);border:1px solid rgba(120,255,230,.3);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #touch div:active{background:rgba(67,233,123,.35)}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>

<div id="hud"><span id="score">0</span><span id="spd">0 KM/H</span></div>

<div id="touch">
  <div id="tleft">◀</div>
  <div id="tright">▶</div>
</div>

<div id="overlay">
  <div>
    <h1 id="title">NEON HIGHWAY 3D</h1>
    <p id="sub">◀ ▶ ya A / D se car chalao<br>Traffic se bacho — speed har second badhegi</p>
    <div id="final"></div>
    <button id="btn">START GAME</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============ CONSTANTS ============ */
const ROAD_W = 14;
const LANES  = [-4.6, 0, 4.6];
const CYCLE  = 306;              // world recycling length
const COLORS = [0xff4d6d, 0xffd166, 0x4cc9f0, 0xb5179e, 0x80ed99, 0xff9f1c];

/* ============ RENDERER / SCENE ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a16);
scene.fog = new THREE.Fog(0x070a16, 80, 250);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 6.5, 12);
camera.lookAt(0, 1.4, -14);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ LIGHTS ============ */
scene.add(new THREE.HemisphereLight(0x9db4ff, 0x0a0a14, 1.5));

const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(-30, 55, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 170 });
sun.shadow.bias = -0.0006;
sun.target.position.set(0, 0, -30);
scene.add(sun, sun.target);

/* ============ GROUND & ROAD ============ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 900),
  new THREE.MeshStandardMaterial({ color: 0x080c18, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -300;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(ROAD_W, 900),
  new THREE.MeshStandardMaterial({ color: 0x1a2032, roughness: 0.85, metalness: 0.15 })
);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.02, -300);
road.receiveShadow = true;
scene.add(road);

// glowing edge lines
const edgeMat = new THREE.MeshStandardMaterial({
  color: 0x38f9d7, emissive: 0x38f9d7, emissiveIntensity: 1.6, roughness: 0.4
});
for (const x of [-6.9, 6.9]) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 900), edgeMat);
  line.position.set(x, 0.05, -300);
  scene.add(line);
}

/* ============ LANE DASHES ============ */
const dashes = [];
const dashGeo = new THREE.BoxGeometry(0.34, 0.06, 4.2);
const dashMat = new THREE.MeshStandardMaterial({
  color: 0xdfe9ff, emissive: 0x7fb0ff, emissiveIntensity: 0.7, roughness: 0.5
});
for (const x of [-2.3, 2.3]) {
  for (let z = 30; z >= -276; z -= 9) {
    const d = new THREE.Mesh(dashGeo, dashMat);
    d.position.set(x, 0.06, z);
    scene.add(d);
    dashes.push(d);
  }
}

/* ============ STREET LIGHTS (props) ============ */
const props = [];
const poleGeo = new THREE.BoxGeometry(0.24, 4.2, 0.24);
const bulbGeo = new THREE.SphereGeometry(0.36, 10, 8);
const poleMat = new THREE.MeshStandardMaterial({ color: 0x2a3350, roughness: 0.8 });
const bulbMat = new THREE.MeshStandardMaterial({
  color: 0xaaffee, emissive: 0x38f9d7, emissiveIntensity: 2.4
});
for (let z = 30; z >= -276; z -= 18) {
  for (const side of [-1, 1]) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = 2.1; pole.castShadow = true; g.add(pole);
    const bulb = new THREE.Mesh(bulbGeo, bulbMat);
    bulb.position.y = 4.25; g.add(bulb);
    g.position.set(side * 8.3, 0, z);
    scene.add(g);
    props.push(g);
  }
}

/* ============ CAR FACTORY ============ */
function createCar(color) {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.35 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b1622, metalness: 0.95, roughness: 0.08 });
  const tyreMat = new THREE.MeshStandardMaterial({ color: 0x11141c, roughness: 0.95 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.62, 4.1), bodyMat);
  body.position.y = 0.63;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.58, 1.95), glassMat);
  cabin.position.set(0, 1.18, -0.1);
  cabin.castShadow = true;
  g.add(cabin);

  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.09, 0.4), bodyMat);
  spoiler.position.set(0, 1.02, 1.85);
  spoiler.castShadow = true;
  g.add(spoiler);

  const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.32, 14);
  wheelGeo.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.95, 1.35], [0.95, 1.35], [-0.95, -1.35], [0.95, -1.35]]) {
    const w = new THREE.Mesh(wheelGeo, tyreMat);
    w.position.set(x, 0.38, z);
    w.castShadow = true;
    g.add(w);
  }

  // headlights (front = -z)
  const headMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xbfe9ff, emissiveIntensity: 3
  });
  const headGeo = new THREE.BoxGeometry(0.45, 0.16, 0.08);
  for (const x of [-0.62, 0.62]) {
    const h = new THREE.Mesh(headGeo, headMat);
    h.position.set(x, 0.72, -2.06);
    g.add(h);
  }

  // taillights
  const tailMat = new THREE.MeshStandardMaterial({
    color: 0xff2d55, emissive: 0xff2d55, emissiveIntensity: 2.6
  });
  for (const x of [-0.62, 0.62]) {
    const t = new THREE.Mesh(headGeo, tailMat);
    t.position.set(x, 0.72, 2.06);
    g.add(t);
  }

  g.userData.bodyMat = bodyMat;
  return g;
}

/* ============ PLAYER ============ */
const player = createCar(0x00e5ff);
scene.add(player);

/* ============ TRAFFIC ============ */
const traffic = [];
for (let i = 0; i < 9; i++) {
  const c = createCar(COLORS[i % COLORS.length]);
  scene.add(c);
  traffic.push(c);
}

function respawnTraffic(t, initial) {
  const lane = LANES[Math.floor(Math.random() * LANES.length)];
  t.position.x = lane + (Math.random() - 0.5) * 0.5;
  t.position.z = initial
    ? -50 - Math.random() * 210
    : -215 - Math.random() * 70;
  t.userData.ownSpeed = 8 + Math.random() * 13;
  t.userData.bodyMat.color.setHex(COLORS[Math.floor(Math.random() * COLORS.length)]);
}

/* ============ GAME STATE ============ */
const G = {
  mode: 'menu',       // menu | play | over
  speed: 28,
  dist: 0,
  px: 0,
  vx: 0,
  best: Number(localStorage.getItem('nh3d_best') || 0)
};

const keys = { left: false, right: false };
let touchAxis = 0;

const elScore = document.getElementById('score');
const elSpd   = document.getElementById('spd');
const elOverlay = document.getElementById('overlay');
const elTitle = document.getElementById('title');
const elSub   = document.getElementById('sub');
const elFinal = document.getElementById('final');
const elBtn   = document.getElementById('btn');

/* ============ WORLD MOVEMENT ============ */
function moveWorld(dt, spd) {
  const dz = spd * dt;
  for (const d of dashes) {
    d.position.z += dz;
    if (d.position.z > 30) d.position.z -= CYCLE;
  }
  for (const p of props) {
    p.position.z += dz;
    if (p.position.z > 30) p.position.z -= CYCLE;
  }
}

/* ============ START / RESET ============ */
function startGame() {
  G.mode = 'play';
  G.speed = 28;
  G.dist = 0;
  G.px = 0;
  G.vx = 0;
  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  camera.position.set(0, 6.5, 12);

  for (const t of traffic) respawnTraffic(t, true);

  elOverlay.classList.add('hide');
}

function gameOver() {
  G.mode = 'over';
  const score = Math.floor(G.dist);
  if (score > G.best) {
    G.best = score;
    localStorage.setItem('nh3d_best', String(score));
  }
  elTitle.textContent = 'CRASH!';
  elSub.textContent = 'Traffic se takra gaye 🚗💥';
  elFinal.innerHTML = `Score: <b>${score}</b> m &nbsp;·&nbsp; Best: <b>${G.best}</b> m`;
  elBtn.textContent = 'RESTART';
  elOverlay.classList.remove('hide');
}

/* ============ INPUT ============ */
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
  if ((k === ' ' || k === 'Enter') && G.mode !== 'play') { startGame(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});

const bind = (id, val) => {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); touchAxis = val; };
  const off = e => { e.preventDefault(); touchAxis = 0; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
};
bind('tleft', -1);
bind('tright', 1);

elBtn.addEventListener('click', startGame);

/* ============ UPDATE ============ */
function update(dt) {
  // --- input
  let axis = 0;
  if (keys.left) axis -= 1;
  if (keys.right) axis += 1;
  if (touchAxis !== 0) axis = touchAxis;

  // --- speed ramps up with distance
  G.speed = Math.min(96, 28 + G.dist * 0.05);
  G.dist += G.speed * dt;

  // --- lateral steering (with inertia)
  G.vx += axis * 80 * dt;
  G.vx *= Math.exp(-9 * dt);
  G.px += G.vx * dt;

  const limit = ROAD_W / 2 - 1.15;
  if (G.px >  limit) { G.px =  limit; G.vx = 0; }
  if (G.px < -limit) { G.px = -limit; G.vx = 0; }

  player.position.x = G.px;
  player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -G.vx * 0.035, 0.16);
  player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, -G.vx * 0.022, 0.12);

  // --- camera follow
  camera.position.x += (G.px * 0.55 - camera.position.x) * Math.min(1, 6 * dt);
  camera.position.y = 6.5;
  camera.lookAt(G.px * 0.4, 1.5, -14);

  // --- world scroll
  moveWorld(dt, G.speed);

  // --- traffic
  for (const t of traffic) {
    t.position.z += (G.speed - t.userData.ownSpeed) * dt;
    if (t.position.z > 26) respawnTraffic(t, false);

    if (Math.abs(t.position.x - G.px) < 1.68 &&
        Math.abs(t.position.z - player.position.z) < 3.75) {
      gameOver();
      return;
    }
  }

  elScore.textContent = Math.floor(G.dist);
  elSpd.textContent = Math.round(G.speed * 2.6) + ' KM/H';
}

function idle(dt) {
  moveWorld(dt, 16);
  camera.lookAt(0, 1.5, -14);
}

/* ============ LOOP ============ */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (G.mode === 'play') update(dt);
  else idle(dt);
  renderer.render(scene, camera);
}

// initial traffic placement
for (const t of traffic) respawnTraffic(t, true);

loop();
</script>
</body>
</html>
